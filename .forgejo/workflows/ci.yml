name: Release

on:
  push:

jobs:
  test:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
          activate-environment: "true"

      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y -q samtools

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest tests/ -v

  release:
    needs:
      - test
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.14
          enable-cache: false
          activate-environment: "true"

      - name: Install rattler-build
        run: |
          curl -fsSL -o /usr/local/bin/rattler-build \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.64.1/rattler-build-x86_64-unknown-linux-musl
          chmod +x /usr/local/bin/rattler-build
          rattler-build --version

      - name: Install Node deps
        env:
          NPM_TOKEN: ${{ secrets.PKG_RELEASE_TOKEN }}
        run: npm ci

      - name: Git identity
        run: |
          git config user.name "semantic-release"
          git config user.email "<>"

      - name: Semantic Release
        env:
          GIT_AUTHOR_NAME: semantic-release
          GIT_AUTHOR_EMAIL: <>
          GIT_COMMITTER_NAME: semantic-release
          GIT_COMMITTER_EMAIL: <>
          PACKAGE_UPLOAD_TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_URL: "https://git.reslate.solutions"
          HUSKY: 0
        run: npx semantic-release
